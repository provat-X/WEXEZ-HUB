
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: zulu
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: zulu
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Prepare private properties
        env:
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > private.properties
          else
            touch private.properties
          fi

      - name: Build Debug and Release APK
        env:
          APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
        run: ./gradlew --no-daemon assembleGithubDebug assembleGithubRelease

      - name: Upload WEXE HUB APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: WEXE-HUB-APK
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
